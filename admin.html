<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مخطط الأرشيف الكوني - سكتشيك & Google Flow</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-darkest: #07080c;
            --bg-main: #0c0e17;
            --bg-card: #131624;
            --bg-input: #1a1e30;
            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #4b5563;
            --color-cyan: #06b6d4;
            --color-accent: #6366f1;
            --color-danger: #ef4444;
            --border-light: rgba(255, 255, 255, 0.08);
            --radius-md: 12px;
            --radius-sm: 6px;
            --transition-smooth: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Cairo', 'Outfit', sans-serif;
            background-color: var(--bg-darkest);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 95vh;
            background-image: radial-gradient(circle at top right, rgba(99, 102, 241, 0.1), transparent 400px);
        }

        .container {
            width: 100%;
            max-width: 950px;
            background: var(--bg-main);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            padding: 25px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-light);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        header h1 {
            margin: 0;
            font-size: 1.3rem;
            font-weight: 700;
        }

        header h1 span {
            color: var(--color-cyan);
        }

        .tab-nav {
            display: flex;
            background: var(--bg-card);
            padding: 4px;
            border-radius: 50px;
            gap: 4px;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-secondary);
            padding: 8px 16px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            font-family: inherit;
            transition: var(--transition-smooth);
        }

        .tab-btn.active {
            background: var(--color-accent);
            color: var(--text-main);
        }

        .tab-pane {
            display: none;
            animation: fadeIn 0.3s ease-out forwards;
        }

        .tab-pane.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Forms & Grid layout */
        .db-grid {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 20px;
            margin-top: 15px;
        }

        @media (max-width: 768px) {
            .db-grid {
                grid-template-columns: 1fr;
            }
        }

        .card-box {
            background: var(--bg-card);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            padding: 20px;
        }

        .card-box h3 {
            margin: 0 0 15px 0;
            font-size: 1.05rem;
            color: var(--color-cyan);
            border-bottom: 1px solid var(--border-light);
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .form-group input, .form-group select, .form-group textarea {
            background: var(--bg-input);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            padding: 10px;
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.85rem;
            outline: none;
            transition: var(--transition-smooth);
        }

        .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
            border-color: var(--color-cyan);
        }

        .btn-autofill {
            background: var(--bg-input);
            color: var(--color-cyan);
            border: 1px solid rgba(6, 182, 212, 0.2);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.72rem;
            cursor: pointer;
            align-self: flex-end;
            margin-bottom: 2px;
            font-weight: bold;
        }

        /* Buttons */
        .btn {
            background: var(--bg-input);
            color: var(--text-main);
            border: 1px solid var(--border-light);
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition-smooth);
        }

        .btn:hover {
            background: var(--border-light);
        }

        .btn-primary {
            background: var(--color-accent);
            border: none;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        /* List Items */
        .items-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 480px;
            overflow-y: auto;
        }

        .item-row {
            background: var(--bg-input);
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: start;
            gap: 10px;
            transition: var(--transition-smooth);
        }

        .item-row:hover {
            border-color: var(--color-cyan);
        }

        .item-info h4 {
            margin: 0;
            font-size: 0.9rem;
        }

        .item-info p {
            margin: 4px 0 0 0;
            font-size: 0.75rem;
            color: var(--text-secondary);
            line-height: 1.4;
        }

        .item-actions {
            display: flex;
            gap: 6px;
        }

        .btn-action {
            background: transparent;
            border: none;
            font-size: 0.72rem;
            cursor: pointer;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .btn-edit { color: var(--color-cyan); }
        .btn-delete { color: var(--color-danger); }

        /* Output Spell */
        .output-box {
            background: #090a0f;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
            padding: 15px;
            margin-top: 15px;
        }

        .output-title {
            font-size: 0.72rem;
            color: var(--color-cyan);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .output-text {
            font-family: monospace;
            font-size: 0.8rem;
            color: #cbd5e1;
            white-space: pre-wrap;
            word-break: break-all;
            margin: 0 0 10px 0;
            max-height: 120px;
            overflow-y: auto;
            direction: ltr;
            text-align: left;
        }

        .checkbox-group-container {
            border: 1px solid var(--border-light);
            padding: 10px;
            border-radius: var(--radius-sm);
            background-color: var(--bg-input);
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 100px;
            overflow-y: auto;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .checkbox-item input {
            cursor: pointer;
        }

        /* Act Blocks */
        .act-group-block {
            margin-bottom: 25px;
            border: 1px solid var(--border-light);
            border-radius: var(--radius-md);
            padding: 12px;
            background: rgba(255, 255, 255, 0.01);
        }

        .act-group-title {
            font-size: 0.85rem;
            font-weight: bold;
            padding: 4px 10px;
            border-radius: 4px;
            margin-bottom: 12px;
            display: inline-block;
        }

        .act-title-1 { background: rgba(59, 130, 246, 0.15); color: #60a5fa; }
        .act-title-2 { background: rgba(239, 68, 68, 0.15); color: #f87171; }
        .act-title-3 { background: rgba(139, 92, 246, 0.15); color: #c084fc; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>مخطط الأرشيف الكوني <span>سكتشيك & Google Flow</span></h1>
        <div class="tab-nav">
            <button class="tab-btn active" data-tab="schools" onclick="window.app.switchTab('schools')">🎨 المدارس الفنية</button>
            <button class="tab-btn" data-tab="characters" onclick="window.app.switchTab('characters')">👤 الشخصيات والأصوات</button>
            <button class="tab-btn" data-tab="scenarios" onclick="window.app.switchTab('scenarios')">🎬 السيناريوهات</button>
        </div>
    </header>

    <!-- Tab 1: Art Schools DB -->
    <div class="tab-pane active" id="tab-schools">
        <div class="db-grid">
            <div class="card-box">
                <h3 id="school-form-title">إضافة مدرسة فنية جديدة</h3>
                <input type="hidden" id="school-edit-id">
                
                <div class="form-group">
                    <label for="school-name">اسم المدرسة الفنية *</label>
                    <input type="text" id="school-name" placeholder="مثال: Neon Cyberpunk, Manga G-Pen...">
                </div>

                <div class="form-group" style="position: relative;">
                    <button type="button" class="btn-autofill" onclick="window.app.autofillSchoolSpecs()">✨ Autofill Specifications</button>
                    <label for="school-desc">الوصف البصري والملمس والإضاءة *</label>
                    <textarea id="school-desc" rows="6" placeholder="صف الخواص البصرية ومستوى الكثافة والإضاءة..."></textarea>
                </div>

                <div style="display: flex; gap: 10px;">
                    <button type="button" class="btn btn-primary" onclick="window.app.saveSchool()">حفظ المدرسة الفنية ✅</button>
                    <button type="button" class="btn" onclick="window.app.clearSchoolForm()">تفريغ</button>
                </div>
            </div>

            <div class="card-box">
                <h3>أرشيف المدارس الفنية</h3>
                <div class="items-list" id="schools-list">
                    <!-- Dynamic list -->
                </div>
            </div>
        </div>
    </div>

    <!-- Tab 2: Characters & Voices DB -->
    <div class="tab-pane" id="tab-characters">
        <div class="db-grid">
            <div class="card-box">
                <h3 id="character-form-title">إضافة شخصية جديدة</h3>
                <input type="hidden" id="character-edit-id">

                <div class="form-group">
                    <label for="char-name">اسم الشخصية *</label>
                    <input type="text" id="char-name" placeholder="مثال: كينجي (Kenji), آرا (Ara)...">
                </div>

                <div class="form-group">
                    <label for="char-school">المدرسة الفنية الافتراضية *</label>
                    <select id="char-school">
                        <option value="">-- اختر مدرسة فنية --</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="char-voice-spec">الصوت المخصص (Custom Voice) *</label>
                    <input type="text" id="char-voice-spec" placeholder="مثال: صوت رجولي عميق وحاد بنبرة بطل انمي جاد" value="صوت رجولي عميق وحاد بنبرة بطل انمي جاد">
                </div>

                <div class="form-group" style="position: relative;">
                    <button type="button" class="btn-autofill" onclick="window.app.autofillCharacterInfo()">✨ Autofill Character Info</button>
                    <label for="char-psychology-preset">قالب السيكولوجيا (Psychology Preset)</label>
                    <select id="char-psychology-preset">
                        <option value="stoic">Stoic & observant (هادئ ومراقب حذر)</option>
                        <option value="dread">Existential dread (قلق وجودي من التلاشي والمحو)</option>
                        <option value="keeper">Fierce protector of style (حامي شرس لنقاوة الرسم)</option>
                        <option value="hybrid">Volatile glitch hybrid (كائن هجين مشوش وقلق)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="char-info-text">وصف الشخصية الوجودي [Character Info (optional)] *</label>
                    <textarea id="char-info-text" rows="5" placeholder="English psychological description used by Google Flow agent..."></textarea>
                </div>

                <div style="display: flex; gap: 10px;">
                    <button type="button" class="btn btn-primary" onclick="window.app.saveCharacter()">حفظ الشخصية ✅</button>
                    <button type="button" class="btn" onclick="window.app.clearCharacterForm()">تفريغ</button>
                </div>
            </div>

            <div class="card-box">
                <h3>أرشيف طاقم الشخصيات</h3>
                <div class="items-list" id="characters-list">
                    <!-- Dynamic list -->
                </div>
            </div>
        </div>
    </div>

    <!-- Tab 3: Scenarios DB -->
    <div class="tab-pane" id="tab-scenarios">
        <div class="db-grid">
            <div class="card-box">
                <h3 id="scenario-form-title">إضافة سيناريو جديد</h3>
                <input type="hidden" id="scenario-edit-id">

                <div class="form-group">
                    <label for="scenario-title">عنوان السيناريو *</label>
                    <input type="text" id="scenario-title" placeholder="أدخل اسم السيناريو الحركي...">
                </div>

                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex: 1.2;">
                        <label for="scenario-school">المدرسة الفنية الحاكمة *</label>
                        <select id="scenario-school" onchange="window.app.updateScenarioPreview()">
                            <option value="">-- اختر مدرسة فنية --</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex: 0.8;">
                        <label for="scenario-act">المرحلة / الفصل السردي *</label>
                        <select id="scenario-act" onchange="window.app.updateScenarioPreview()">
                            <option value="act1">الفصل الأول (Genesis)</option>
                            <option value="act2">الفصل الثاني (Clash)</option>
                            <option value="act3">الفصل الثالث (Resolution)</option>
                        </select>
                    </div>
                    <div class="form-group" style="width: 80px;">
                        <label for="scenario-order">الترتيب *</label>
                        <input type="number" id="scenario-order" value="1" min="1" style="text-align: center;" oninput="window.app.updateScenarioPreview()">
                    </div>
                </div>

                <div class="form-group">
                    <label>الشخصيات المشاركة في السيناريو *</label>
                    <div class="checkbox-group-container" id="scenario-chars-container" onchange="window.app.updateScenarioPreview()">
                        <!-- Dynamic checkboxes -->
                    </div>
                </div>

                <div class="form-group">
                    <label for="scenario-script">نص السيناريو والأفكار الحركية *</label>
                    <textarea id="scenario-script" rows="5" oninput="window.app.updateScenarioPreview()" placeholder="اكتب الأحداث والحوارات واللقطات بالتسلسل هنا..."></textarea>
                </div>

                <div style="display: flex; gap: 10px; margin-bottom: 15px;">
                    <button type="button" class="btn btn-primary" onclick="window.app.saveScenario()">حفظ السيناريو ✅</button>
                    <button type="button" class="btn" onclick="window.app.clearScenarioForm()">تفريغ</button>
                </div>
            </div>

            <!-- Dynamic Prompts output panel for Copying -->
            <div class="card-box" style="display: flex; flex-direction: column; gap: 15px;">
                <h3>مركز نسخ الأصول لـ Google Flow</h3>
                
                <div class="output-box">
                    <div class="output-title">1. موجه السيناريو بـ Google Flow (Script Prompt)</div>
                    <div class="output-text" id="scenario-prompt-output">قم بتعبئة البيانات للتركيب...</div>
                    <button type="button" class="btn btn-primary" style="width: 100%; font-size: 0.75rem; padding: 4px;" onclick="window.app.copyText('scenario-prompt-output')">نسخ موجه السيناريو 📋</button>
                </div>

                <div id="dynamic-characters-output-container">
                    <!-- Dynamic Character blocks -->
                </div>
            </div>
        </div>
        
        <div class="card-box" style="margin-top: 20px;">
            <h3>أرشيف السيناريوهات المرحلي</h3>
            <div class="items-list" id="scenarios-list">
                <!-- Grouped by Act dynamically -->
            </div>
        </div>
    </div>

</div>

<script src="js/app.js"></script>
</body>
</html>
