<style>

    --teal: #38a3a5;
    --emerald: #34d399;
    --crimson: #f87171;
    --text: #f3efe6;
    --muted: #b0a99f;

  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
    background: radial-gradient(circle at top right, #1f1a2c 0%, var(--bg) 55%);
    color: var(--text); line-height: 1.55; padding-bottom: 64px;
  }
  header {
    position: sticky; top: 0; z-index: 40;
    background: rgba(15, 14, 19, 0.94); backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border); padding: 14px 20px;
  }
  .top-row {
    max-width: 1320px; margin: 0 auto; display: flex; flex-wrap: wrap;
    align-items: center; justify-content: space-between; gap: 12px;
  }
  .brand h1 { margin: 0; font-size: 1.25rem; color: var(--gold); }
  .brand p { margin: 2px 0 0; font-size: 0.85rem; color: var(--muted); }
  .stats { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .stat-pill {
    background: var(--card2); border: 1px solid var(--border);
    padding: 6px 12px; border-radius: 999px; font-size: 0.85rem; font-weight: 600;
  }
  .btn-reset {
    background: transparent; color: var(--muted); border: 1px solid rgba(255,255,255,0.16);
    border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 0.8rem;
  }
  .btn-reset:hover { color: var(--text); border-color: var(--gold); }
  .tabs-wrap {
    max-width: 1320px; margin: 12px auto 0; display: flex; flex-wrap: wrap; gap: 8px;
  }
  .tab-btn {
    background: var(--card); color: var(--muted); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px; padding: 8px 13px; cursor: pointer; font-size: 0.86rem; font-weight: 600;
    display: inline-flex; align-items: center; gap: 6px; transition: 0.15s ease;
  }
  .tab-btn:hover { border-color: var(--gold); color: var(--text); }
  .tab-btn.active { background: rgba(244, 196, 78, 0.16); border-color: var(--gold); color: var(--gold); }
  .tab-count { font-size: 0.75rem; opacity: 0.85; }
  main { max-width: 1320px; margin: 20px auto; padding: 0 20px; }
  .ep-banner {
    background: var(--card2); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px 20px; margin-bottom: 18px; display: flex; flex-wrap: wrap;
    align-items: center; justify-content: space-between; gap: 12px;
  }
  .ep-banner h2 { margin: 0 0 4px; font-size: 1.2rem; color: var(--gold); }
  .ep-banner .sub { color: var(--muted); font-size: 0.9rem; }
  .flow-link {
    background: linear-gradient(135deg, #f4c44e, #d99b26); color: #16131c;
    text-decoration: none; font-weight: 700; padding: 10px 16px; border-radius: 10px;
    font-size: 0.9rem; display: inline-flex; align-items: center; gap: 6px;
  }
  .grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
  .scene-card {
    background: var(--card); border: 1px solid rgba(255,255,255,0.12);
    border-radius: 14px; padding: 18px; transition: 0.15s ease;
  }
  .scene-card.done { border-color: rgba(52, 211, 153, 0.55); background: #151c1b; }
  .card-head {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px;
    margin-bottom: 12px;
  }
  .scene-title { font-size: 1.05rem; font-weight: 700; color: #fff; }
  .mode-badge {
    font-family: ui-monospace, Consolas, monospace; font-size: 0.78rem; dir: ltr;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14);
    padding: 4px 10px; border-radius: 8px; color: #e2dce8;
  }
  .mode-badge.veo { border-color: rgba(244, 196, 78, 0.5); color: var(--gold); }
  .chips-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px;
    border-radius: 9px; font-size: 0.84rem; font-weight: 600; cursor: pointer; border: 1px solid transparent;

  .chip-char { background: rgba(244, 196, 78, 0.13); border-color: rgba(244, 196, 78, 0.45); color: #fde68a; }
  .chip-img  { background: rgba(56, 163, 165, 0.15); border-color: rgba(56, 163, 165, 0.45); color: #99f6e4; }
  .chip-voice{ background: rgba(52, 211, 153, 0.14); border-color: rgba(52, 211, 153, 0.45); color: #a7f3d0; }

  .chip-copy-hint { font-size: 0.72rem; opacity: 0.7; }
  .workflow-row { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 12px; }
  .wf-badge {
    display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px;
    border-radius: 7px; font-size: 0.78rem; font-weight: 700; border: 1px solid transparent;

  .wf-mux { background: rgba(251, 146, 60, 0.16); border-color: rgba(251, 146, 60, 0.5); color: #fed7aa; }

  .wf-lite { background: rgba(52, 211, 153, 0.12); border-color: rgba(52, 211, 153, 0.45); color: #a7f3d0; }
  .prompt-box {
    direction: ltr; text-align: left; font-family: ui-monospace, Consolas, monospace;
    font-size: 0.83rem; background: #100f15; border: 1px solid rgba(255,255,255,0.1);

    margin-bottom: 12px;

  .actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
  .btn-copy {
    background: linear-gradient(135deg, #38a3a5, #257a7c); color: #fff;
    border: none; border-radius: 9px; padding: 10px 18px; font-size: 0.9rem; font-weight: 700;
    cursor: pointer; display: inline-flex; align-items: center; gap: 8px;

  .btn-done {
    background: var(--card2); color: var(--muted); border: 1px solid rgba(255,255,255,0.16);

  }
  .toast {
    position: fixed; bottom: 20px; left: 20px; background: var(--gold); color: #16131c;
    font-weight: 700; padding: 10px 16px; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.5);

  .agent-panel {
    background: linear-gradient(135deg, rgba(244, 196, 78, 0.08), rgba(56, 163, 165, 0.08));

    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;

  .agent-title p { margin: 0; font-size: 0.86rem; color: var(--muted); }
  .agent-btns { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn-agent {
    background: linear-gradient(135deg, #f4c44e, #d99b26); color: #16131c;
    border: none; border-radius: 9px; padding: 9px 14px; font-size: 0.86rem; font-weight: 700;

  var AGENT_ADDONS = {

  };

  function getEpisodeAgentInstructions(tabId) {
    return AGENT_ADDONS[tabId] ? (AGENT_MASTER + '\n\n' + AGENT_ADDONS[tabId]) : AGENT_MASTER;
  }

  function getStartFramesChatPrompt(badge) {
    var cleanBadge = String(badge || 'S2E0X').replace(/[^\w-]/g, '').trim() || 'S2E0X';
    return 'Before generating any paid video clip, use Nano Banana 2.1 (16:9, 0 credits) to create 4 framing and lighting variations for ' + cleanBadge + ' Scene [SXX] using my attached @Character cards and Ingredients plate. Keep strict Zero-Drift Visual DNA, Scale Anchor, and left-window lighting lock. Do not generate video until I pick the winning frame.';
  }

  function getFourPanelSheetPrompt(badge) {
    var cleanBadge = String(badge || 'S2E0X').replace(/[^\w-]/g, '').trim() || 'S2E0X';
    return 'Create only 1 image in horizontal 16:9 aspect ratio via Nano Banana 2.1 (0 credits) for ' + cleanBadge + '. Using the attached portrait/reference image as the ONLY reference, generate a 4-panel character reference sheet of this exact same character keeping face, eyes, hair/material texture, proportions, and outfit strictly identical across every panel. Layout left to right in four panels: (1) large head-and-shoulders close-up facing camera, (2) full-body front view, (3) full-body left side profile view, (4) full-body back view. Plain seamless neutral studio background, soft even lighting, same scale across all panels, strictly NO text, NO labels, NO other people.';
  }

  function getOrganizeChatPrompt(badge) {
    var cleanBadge = String(badge || 'S2E0X').replace(/[^\w-]/g, '').trim() || 'S2E0X';
    return 'Rename our approved scene clips sequentially as ' + cleanBadge + '_S01 through ' + cleanBadge + '_S18, upscale approved clips to 1080p if needed, move all winning Start Frames into Collection `01_StartFrames`, approved clips into `02_Approved_Clips`, and unused drafts into `03_Rejected_Drafts` so I can export them for final FFmpeg assembly.';
  }

  function buildFlowAgentScenePrompt(sc, badge) {
    var cleanBadge = String(badge || '').replace(/[^\w-]/g, '').trim();
    var chars = (sc.characters && sc.characters.length) ? sc.characters.join(', ') : 'None (0 characters)';
    var imgs = (sc.images && sc.images.length) ? sc.images.join(', ') : 'None';
    var voiceStr = (sc.voice && sc.voice !== 'SILENT') ? (sc.voice + ' (ONLY)') : 'SILENT (No dialogue — Foley & score only)';
    var bridgeStr = sc.hasLastFrameBridge
      ? ('Attach Last-Frame Bridge (`Save frame` -> `Frames` tab) from Scene ' + (sc.num - 1))
      : (sc.needsStartFrame ? 'Use Start Frame (Nano Banana 2.1 · 0c)' : 'Master / Standalone Shot');
    return 'Generate ' + (cleanBadge ? cleanBadge + ' ' : '') + 'Scene ' + sc.num + ' (' + sc.title + ') via ' + sc.mode + '.\n' +
      '- Characters (`Characters` tab): ' + chars + '\n' +
      '- Ingredients (`Images` tab): ' + imgs + '\n' +
      '- Voice Lock (`1:1`): ' + voiceStr + '\n' +
      '- Continuity (`Frames` tab): ' + bridgeStr + '\n' +
      '- Use this exact prompt VERBATIM without changing any Visual DNA, Scale Anchor, Voice Lock, or Audio Lock wording:\n' +
      sc.prompt;
  }
  var toastEl = document.getElementById('toast');
  var toastTimer = null;

  function showToast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 1800);
  }

  function copyText(text, label) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        showToast(label || 'تم النسخ للحافظة!');
      }).catch(function () { fallbackCopy(text, label); });
    } else {
      fallbackCopy(text, label);
    }
  }

  function fallbackCopy(text, label) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta);
    showToast(label || 'تم النسخ للحافظة!');
  }

  function saveDone() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(doneMap)); } catch (e) {}
  }

  function updateHeaderStats() {
    var totalScenes = 0, doneScenes = 0, remCredits = 0;
    DATA.forEach(function (tab) {
      tab.scenes.forEach(function (sc) {
        totalScenes++;
        if (doneMap[sc.key]) doneScenes++;
        else remCredits += sc.credits;
      });
    });
    document.getElementById('globalProgress').textContent = 'المنجز: ' + doneScenes + ' / ' + totalScenes + ' لقطة';
    document.getElementById('totalCostBadge').textContent = 'المتبقي التقديري: ' + remCredits + ' credits';
  }

  function renderTabs() {
    var bar = document.getElementById('tabsBar');
    bar.innerHTML = '';
    DATA.forEach(function (tab) {
      var doneInTab = tab.scenes.filter(function (s) { return !!doneMap[s.key]; }).length;
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'tab-btn' + (tab.id === activeTabId ? ' active' : '');
      var s1 = document.createElement('span');
      s1.textContent = tab.badge;
      var s2 = document.createElement('span');
      s2.className = 'tab-count';
      s2.textContent = '(' + doneInTab + '/' + tab.scenes.length + ')';
      btn.appendChild(s1);
      btn.appendChild(s2);
      btn.addEventListener('click', function () {
        activeTabId = tab.id;
        renderTabs();
        renderActiveTab();
      });
      bar.appendChild(btn);
    });
  }

  function makeChip(cls, icon, prefix, val, copyVal) {
    var el = document.createElement('button');
    el.type = 'button';
    el.className = 'chip ' + cls;
    el.textContent = icon + ' ' + prefix + ': ' + val;
    if (copyVal) {
      el.title = 'انقر لنسخ اسم البحث: ' + copyVal;
      el.addEventListener('click', function () { copyText(copyVal, 'نُسخ: ' + copyVal); });
    }
    return el;
  }

  function renderActiveTab() {
    var tab = DATA.find(function (t) { return t.id === activeTabId; }) || DATA[0];
    var main = document.getElementById('boardMain');
    main.innerHTML = '';
    if (!tab) return;

    var tabCost = tab.scenes.reduce(function (acc, s) { return acc + s.credits; }, 0);
    var banner = document.createElement('section');
    banner.className = 'ep-banner';
    var info = document.createElement('div');
    var h2 = document.createElement('h2');
    h2.textContent = tab.badge + ' — ' + tab.titleAr;
    var sub = document.createElement('div');
    sub.className = 'sub';
    sub.textContent = tab.titleEn + ' · ' + tab.scenes.length + ' مشاهد · التكلفة الإجمالية للتبويب: ' + tabCost + ' credits';
    info.appendChild(h2);
    info.appendChild(sub);

    var link = document.createElement('a');
    link.className = 'flow-link';
    link.href = tab.projectUrl;
    link.target = '_blank';
    link.rel = 'noopener noreferrer';
    link.textContent = 'فتح المشروع في Google Flow ↗';

    banner.appendChild(info);
    banner.appendChild(link);
    main.appendChild(banner);

    var agentText = getEpisodeAgentInstructions(tab.id);
    var agentPanel = document.createElement('section');
    agentPanel.className = 'agent-panel';
    var agentHead = document.createElement('div');
    agentHead.className = 'agent-head';
    var agentTitle = document.createElement('div');
    agentTitle.className = 'agent-title';
    var ah3 = document.createElement('h3');
    ah3.textContent = '🤖 تعليمات Flow Agent الدائمة لهذه الحلقة (Agent Instructions — Zero-Drift)';
    var ap = document.createElement('p');
    ap.textContent = 'فعّل Agent ← Agent settings ← Memory في مشروع Google Flow والصق التعليمات الموحّدة v2 مع ملحق الحلقة، وأرفق لوحة 4-Panel Sheet في خانة Body لكل بطل.';
    agentTitle.appendChild(ah3);
    agentTitle.appendChild(ap);

    var agentBtns = document.createElement('div');
    agentBtns.className = 'agent-btns';
    var btnMaster = document.createElement('button');
    btnMaster.type = 'button';
    btnMaster.className = 'btn-agent';
    btnMaster.textContent = '🤖 نسخ Agent Instructions الكاملة (v2)';
    btnMaster.addEventListener('click', function () {
      copyText(agentText, 'تم نسخ Agent Instructions الكاملة (v2) لـ ' + tab.badge + '!');
    });

    var btnSheetChat = document.createElement('button');
    btnSheetChat.type = 'button';
    btnSheetChat.className = 'btn-agent-sub';
    btnSheetChat.textContent = '🧩 أمر 4-Panel Character Sheet (0c)';
    btnSheetChat.addEventListener('click', function () {
      copyText(getFourPanelSheetPrompt(tab.badge), 'تم نسخ أمر اللوحة الرباعية (0c)!');
    });

    var btnSfChat = document.createElement('button');
    btnSfChat.type = 'button';
    btnSfChat.className = 'btn-agent-sub';
    btnSfChat.textContent = '🖼️ أمر Start Frames (0c)';
    btnSfChat.addEventListener('click', function () {
      copyText(getStartFramesChatPrompt(tab.badge), 'تم نسخ أمر Start Frames (0c)!');
    });

    var btnOrgChat = document.createElement('button');
    btnOrgChat.type = 'button';
    btnOrgChat.className = 'btn-agent-sub';
    btnOrgChat.textContent = '🧹 أمر فرز وترقية 1080p';
    btnOrgChat.addEventListener('click', function () {
      copyText(getOrganizeChatPrompt(tab.badge), 'تم نسخ أمر فرز وترقية المشروع!');
    });

    agentBtns.appendChild(btnMaster);
    agentBtns.appendChild(btnSheetChat);
    agentBtns.appendChild(btnSfChat);
    agentBtns.appendChild(btnOrgChat);
    agentHead.appendChild(agentTitle);
    agentHead.appendChild(agentBtns);
    agentPanel.appendChild(agentHead);

    var agentDetails = document.createElement('details');
    agentDetails.className = 'agent-details';
    var agentSummary = document.createElement('summary');
    agentSummary.textContent = 'معاينة النص الكامل لتعليمات Flow Agent';
    var agentPreview = document.createElement('div');
    agentPreview.className = 'prompt-box';
    agentPreview.textContent = agentText;
    agentDetails.appendChild(agentSummary);
    agentDetails.appendChild(agentPreview);
    agentPanel.appendChild(agentDetails);
    main.appendChild(agentPanel);

    var grid = document.createElement('div');
    grid.className = 'grid';

    tab.scenes.forEach(function (sc) {
      var card = document.createElement('article');
      card.className = 'scene-card' + (doneMap[sc.key] ? ' done' : '');

      var head = document.createElement('div');
      head.className = 'card-head';
      var st = document.createElement('div');
      st.className = 'scene-title';
      st.textContent = 'المشهد ' + sc.num + ': ' + sc.title;
      var mb = document.createElement('span');
      mb.className = 'mode-badge' + (sc.useVeo ? ' veo' : '');
      mb.textContent = sc.mode;
      head.appendChild(st);
      head.appendChild(mb);
      card.appendChild(head);

      var chips = document.createElement('div');
      chips.className = 'chips-row';
      if (sc.characters && sc.characters.length) {
        sc.characters.forEach(function (ch) {
          chips.appendChild(makeChip('chip-char', '🧍', 'Character', ch, ch));
        });
      } else {
        chips.appendChild(makeChip('chip-char', '🧍', 'Characters', 'لا يوجد (0)', ''));
      }
      if (sc.images && sc.images.length) {
        sc.images.forEach(function (im) {
          chips.appendChild(makeChip('chip-img', sc.useVeo ? '🎞️' : '🖼️', sc.useVeo ? 'Start Frame' : 'Image (1 Plate)', im, im));
        });
      } else {
        chips.appendChild(makeChip('chip-img', '🖼️', 'Image', 'لا يوجد', ''));
      }
      if (sc.voice && sc.voice !== 'SILENT') {
        chips.appendChild(makeChip('chip-voice', '🗣️', 'Voice (1:1)', sc.voice, sc.voice));
      } else {
        chips.appendChild(makeChip('chip-silent', '🔇', 'Audio', 'صامت — لا ترفق أي شريحة صوت!', ''));
      }
      card.appendChild(chips);

      if (sc.needsStartFrame || sc.maskedVoiceMux || sc.hasLastFrameBridge || sc.liteEligible) {
        var wf = document.createElement('div');
        wf.className = 'workflow-row';
        function addWf(cls, txt) {
          var b = document.createElement('span');
          b.className = 'wf-badge ' + cls;
          b.textContent = txt;
          wf.appendChild(b);
        }
        if (sc.needsStartFrame) addWf('wf-startframe', '🖼️ Start Frame (Nano Banana 2.1 · 0c)');
        if (sc.maskedVoiceMux) addWf('wf-mux', '🎭 قناع صامت + دمج الصوت (Voice Mux)');
        if (sc.hasLastFrameBridge) addWf('wf-bridge', '🔗 Save Frame Bridge');
        if (sc.liteEligible) addWf('wf-lite', '⚡ بديل توفير: Veo 3.1 Lite (5c)');
        card.appendChild(wf);
      }

      var pbox = document.createElement('div');
      pbox.className = 'prompt-box';
      pbox.textContent = sc.prompt;
      card.appendChild(pbox);

      var acts = document.createElement('div');
      acts.className = 'actions';
      var btnCopy = document.createElement('button');
      btnCopy.type = 'button';
      btnCopy.className = 'btn-copy';
      btnCopy.textContent = '📋 نسخ الأمر الكامل (Copy Prompt)';
      btnCopy.addEventListener('click', function () {
        copyText(sc.prompt, 'تم نسخ أمر المشهد ' + sc.num + '!');
        doneMap[sc.key] = true;
        saveDone();
        card.classList.add('done');
        btnDone.textContent = '✅ تم الإرسال';
        renderTabs();
        updateHeaderStats();
      });

      var btnDone = document.createElement('button');
      btnDone.type = 'button';
      btnDone.className = 'btn-done';
      btnDone.textContent = doneMap[sc.key] ? '✅ تم الإرسال' : 'تحديد كمنجز';
      btnDone.addEventListener('click', function () {
        if (doneMap[sc.key]) delete doneMap[sc.key];
        else doneMap[sc.key] = true;
        saveDone();
        card.classList.toggle('done', !!doneMap[sc.key]);
        btnDone.textContent = doneMap[sc.key] ? '✅ تم الإرسال' : 'تحديد كمنجز';
        renderTabs();
        updateHeaderStats();
      });

      var btnAgentScene = document.createElement('button');
      btnAgentScene.type = 'button';
      btnAgentScene.className = 'btn-agent-scene';
      btnAgentScene.textContent = '🤖 نسخ كأمر Flow Agent';
      btnAgentScene.addEventListener('click', function () {
        copyText(buildFlowAgentScenePrompt(sc, tab.badge), 'تم نسخ أمر Flow Agent للمشهد ' + sc.num + '!');
        doneMap[sc.key] = true;
        saveDone();
        card.classList.add('done');
        btnDone.textContent = '✅ تم الإرسال';
        renderTabs();
        updateHeaderStats();
      });

      var actsGroup = document.createElement('div');
      actsGroup.className = 'actions-group';
      actsGroup.appendChild(btnCopy);
      actsGroup.appendChild(btnAgentScene);

      acts.appendChild(actsGroup);
      acts.appendChild(btnDone);
      card.appendChild(acts);
      grid.appendChild(card);
    });

    main.appendChild(grid);
  }

  document.getElementById('resetDoneBtn').addEventListener('click', function () {
    doneMap = {};
    saveDone();
    renderTabs();
    renderActiveTab();
    updateHeaderStats();
    showToast('تم تصفير علامات الإنجاز');
  });

  renderTabs();
  renderActiveTab();
  updateHeaderStats();
})();
</script>
